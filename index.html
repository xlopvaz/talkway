<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talkway — Think, understand and speak English</title>
  <meta name="description" content="Talkway is an interactive platform to learn real-life English: speaking, listening, vocabulary, grammar in context, pronunciation and a Cabin Crew Aviation English academy." />
  <meta name="theme-color" content="#F2643D" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Apply saved theme before paint to avoid a flash
    try {
      var s = JSON.parse(localStorage.getItem('talkway.v1') || '{}');
      var t = (s.settings && s.settings.theme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/dashboard" aria-label="Talkway home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="9" fill="var(--coral)"/><path d="M8 21.5c3.2-6.4 6.8-9.6 10.8-9.6 2.6 0 4.4 1.3 5.2 3.4" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="24.4" cy="20.6" r="2.3" fill="#fff"/></svg>
        </span>
        <span class="brand-word">talkway<span class="brand-dot">.</span></span>
      </a>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="lang-toggle" role="group" aria-label="Interface language">
          <button data-lang="en">EN</button><button data-lang="es">ES</button>
        </div>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"></button>
        <div class="topbar-title" id="topTitle"></div>
        <div class="top-stats" id="topStats"></div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast-zone" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
